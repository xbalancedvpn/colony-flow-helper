name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Keep debug signing key for later test updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cf-helper-debug-signing-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check planner outcomes
        run: |
          mkdir -p .planner-checks
          javac -d .planner-checks app/src/main/java/com/colonyhelper/overlay/MovePlanner.java app/src/main/java/com/colonyhelper/overlay/BoardVision.java tests/PlannerChecks.java
          java -ea -cp .planner-checks com.colonyhelper.overlay.PlannerChecks

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cf-helper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
